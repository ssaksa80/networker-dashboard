[project]
name = "networker-dashboard"
version = "2.13.1"
description = "Self-contained HTTPS dashboard for Dell NetWorker backup and recovery status"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
# Encrypted credential storage for profiles/sessions; the app runs without it.
crypto = ["cryptography"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# The package's shared logger: ruff applies its logging checks (and BLE001's
# "exception was logged" exemption) to LOG as it would to logging.getLogger().
logger-objects = ["nwdash.config.LOG"]
